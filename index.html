<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#113b52" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sozi BF2" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Sozialkunde-Lerntrainer BF2</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">S</span><span>Sozialkunde<br><strong>BF2 Trainer</strong></span></div>
        <nav id="navigation" aria-label="Lernbereiche"></nav>
        <div class="sidebar-footer"><button id="reset-progress" class="text-button">Lernstand zurücksetzen</button></div>
      </aside>
      <main id="main-content" tabindex="-1"></main>
    </div>
    <template id="toast-template"><div class="toast" role="status"></div></template>
    <script src="app.js"></script>
    <script>
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
      }
    </script>
  </body>
</html>
